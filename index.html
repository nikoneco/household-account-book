<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ed">
  <meta name="description" content="給与、支出、積立を月ごとに記録する家計簿。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com; img-src 'self' blob: data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com https://script.google.com https://*.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>家計簿</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./web/style.css?v=0.1.18">
  <script defer src="./shared/domain.js?v=0.1.18"></script>
  <script type="module" src="./web/app.js?v=0.1.18"></script>
</head>
<body>
  <div class="app-shell">
    <header class="masthead"><a class="brand" href="./" aria-label="家計簿 ホーム">家計簿</a><button id="logout" class="quiet small" hidden>ログアウト</button></header>
    <div id="app-update" class="app-update" role="status" hidden><div><strong>最新版があります</strong><p id="app-update-note">入力中の内容は保存してから更新してください。</p></div><button id="app-update-button" type="button" class="quiet">更新</button></div>
    <div id="mode-note" class="mode-note" hidden></div>
    <div id="message" class="message" role="status" aria-live="polite" hidden></div>
    <div id="error" class="message error" role="alert" hidden></div>
    <div id="pending" class="message warning" hidden><span>保存結果を確認できませんでした。入力はそのまま残っています。</span><button id="retry" class="quiet">同じ内容で再試行</button></div>
    <main id="main" tabindex="-1"><div class="loading">家計簿を準備しています…</div></main>
    <nav id="navigation" class="bottom-nav" aria-label="メインメニュー" hidden>
      <button data-page="home"><span aria-hidden="true">⌂</span>ホーム</button>
      <button data-page="register"><span aria-hidden="true">＋</span>登録</button>
      <button data-page="history"><span aria-hidden="true">≡</span>履歴</button>
      <button data-page="settings"><span aria-hidden="true">⚙</span>毎月の設定</button>
    </nav>
  </div>
</body>
</html>
